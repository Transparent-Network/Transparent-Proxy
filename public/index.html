<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>home</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #fff;
      overflow-x: hidden;
    }
    .header {
      background: rgba(0, 217, 255, 0.1);
      border-bottom: 1px solid rgba(0, 217, 255, 0.3);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #00d9ff;
      text-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
      letter-spacing: 1px;
    }
    .new-tab-btn {
      background: rgba(0, 217, 255, 0.2);
      border: 1px solid rgba(0, 217, 255, 0.4);
      color: #00d9ff;
      padding: 0.5rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .new-tab-btn:hover {
      background: rgba(0, 217, 255, 0.3);
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.4);
      transform: translateY(-2px);
    }
    .main {
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 2rem;
      text-align: center;
    }
    .welcome {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #00d9ff 0%, #00ff88 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 3rem;
    }
    .search-box {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(0, 217, 255, 0.3);
      border-radius: 50px;
      padding: 0.8rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 217, 255, 0.1);
      transition: all 0.3s ease;
    }
    .search-box:focus-within {
      border-color: rgba(0, 217, 255, 0.6);
      box-shadow: 0 8px 32px rgba(0, 217, 255, 0.3);
    }
    .search-icon {
      color: #00d9ff;
      font-size: 1.2rem;
    }
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1rem;
      padding: 0.5rem 0;
    }
    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    .go-btn {
      background: linear-gradient(135deg, #00d9ff 0%, #00ff88 100%);
      border: none;
      color: #0a0e27;
      padding: 0.8rem 2.5rem;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 217, 255, 0.4);
    }
    .go-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 217, 255, 0.6);
    }
    .tabs {
      background: rgba(0, 217, 255, 0.05);
      border-bottom: 1px solid rgba(0, 217, 255, 0.2);
      padding: 0 2rem;
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
    }
    .tab {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 217, 255, 0.2);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      padding: 0.7rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .tab:hover {
      background: rgba(0, 217, 255, 0.1);
    }
    .tab.active {
      background: rgba(0, 217, 255, 0.2);
      border-color: rgba(0, 217, 255, 0.5);
    }
    .tab-close {
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      font-weight: 700;
      transition: color 0.3s ease;
    }
    .tab-close:hover {
      color: #ff4444;
    }
    .status {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid rgba(0, 255, 136, 0.3);
      border-radius: 8px;
      color: #00ff88;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Transparent</div>
    <button class="new-tab-btn" onclick="createTab()">+ 新規タブ</button>
  </div>
  
  <div class="tabs" id="tabs"></div>

  <div class="main">
    <h1 class="welcome">制限なく、自由に</h1>
    <p class="subtitle">高速プロキシで、どこでも、どんなサイトでも</p>
    
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input 
        type="text" 
        class="search-input" 
        id="urlInput"
        placeholder="URLを入力、または検索..."
        onkeydown="if(event.key==='Enter')go()"
      >
      <button class="go-btn" onclick="go()">Go</button>
    </div>

    <div class="status">✅ 準備完了</div>
  </div>

  <script>
    const st = {
      tabs: [],
      activeTab: null,
      wins: new Map()
    };

    function createTab() {
      const id = Date.now();
      const tab = {
        id: id,
        title: '新しいタブ',
        url: '',
        win: null
      };
      st.tabs.push(tab);
      st.activeTab = id;
      renderTabs();
      console.log('✅ タブ作成:', id);
    }

    function closeTab(id, e) {
      e?.stopPropagation();
      const idx = st.tabs.findIndex(t => t.id === id);
      if (idx === -1) return;
      
      const tab = st.tabs[idx];
      const win = st.wins.get(id);
      if (win && !win.closed) {
        win.close();
      }
      st.wins.delete(id);
      
      st.tabs.splice(idx, 1);
      
      if (st.activeTab === id) {
        st.activeTab = st.tabs.length > 0 ? st.tabs[0].id : null;
      }
      
      renderTabs();
      console.log('✅ タブ閉じる:', id);
    }

    function renderTabs() {
      const el = document.getElementById('tabs');
      if (st.tabs.length === 0) {
        el.innerHTML = '';
        return;
      }
      el.innerHTML = st.tabs.map(t => `
        <div class="tab ${t.id === st.activeTab ? 'active' : ''}" onclick="st.activeTab=${t.id};renderTabs()">
          <span>${escapeHtml(t.title)}</span>
          <span class="tab-close" onclick="closeTab(${t.id}, event)">✕</span>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function go() {
      let url = document.getElementById('urlInput').value.trim();
      if (!url) return;
      
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        if (url.includes('.') && !url.includes(' ')) {
          url = 'https://' + url;
        } else {
          url = 'https://duckduckgo.com/?q=' + encodeURIComponent(url);
        }
      }
      
      const b64 = btoa(url);
      const proxyUrl = `/proxy/${b64}`;
      
      const win = window.open('about:blank', '_blank');
      if (!win) {
        alert('ポップアップがブロックされました');
        return;
      }
      
      win.document.title = 'about:blank';
      
      const link = win.document.createElement('link');
      link.rel = 'icon';
      link.href = 'https://ssl.gstatic.com/classroom/favicon.png';
      win.document.head.appendChild(link);
      
      win.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>home</title>
          <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
          <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #000; overflow: hidden; }
            .toolbar { 
              background: #1a1a1a; 
              border-bottom: 1px solid #333; 
              padding: 0.5rem 1rem; 
              display: flex; 
              gap: 0.5rem; 
              align-items: center; 
            }
            .btn { 
              background: #2a2a2a; 
              border: 1px solid #444; 
              color: #fff; 
              padding: 0.4rem 0.8rem; 
              border-radius: 4px; 
              cursor: pointer; 
              font-size: 0.85rem; 
              transition: all 0.2s; 
            }
            .btn:hover { background: #3a3a3a; border-color: #00d9ff; }
            .urlbar { 
              flex: 1; 
              background: #2a2a2a; 
              border: 1px solid #444; 
              border-radius: 20px; 
              padding: 0.5rem 1rem; 
              color: #fff; 
              font-size: 0.9rem; 
              outline: none; 
            }
            .urlbar:focus { border-color: #00d9ff; }
            iframe { 
              width: 100%; 
              height: calc(100vh - 50px); 
              border: none; 
              display: block; 
            }
          </style>
        </head>
        <body>
          <div class="toolbar">
            <button class="btn" onclick="goBack()" title="戻る">◀</button>
            <button class="btn" onclick="goForward()" title="進む">▶</button>
            <button class="btn" onclick="reload()" title="再読み込み">↻</button>
            <button class="btn" onclick="goHome()" title="ホーム">⌂</button>
            <input class="urlbar" id="urlbar" value="${escapeHtml(url)}" onkeydown="if(event.key==='Enter')navigate()">
            <button class="btn" onclick="openOriginal()" title="元のサイトを開く">↗</button>
            <button class="btn" onclick="window.close()" title="閉じる">✕</button>
          </div>
          <iframe id="frame" src="${proxyUrl}" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-pointer-lock allow-presentation allow-top-navigation allow-top-navigation-by-user-activation"></iframe>
          <script>
            let currentUrl = '${url}';
            let currentProxy = '${proxyUrl}';
            
            function goBack() {
              document.getElementById('frame').contentWindow.history.back();
            }
            
            function goForward() {
              document.getElementById('frame').contentWindow.history.forward();
            }
            
            function reload() {
              const iframe = document.getElementById('frame');
              iframe.src = '';
              setTimeout(() => {
                iframe.src = currentProxy;
              }, 100);
            }
            
            function goHome() {
              window.location.href = 'about:blank';
            }
            
            function navigate() {
              let url = document.getElementById('urlbar').value.trim();
              if (!url) return;
              if (!url.startsWith('http://') && !url.startsWith('https://')) {
                if (url.includes('.') && !url.includes(' ')) {
                  url = 'https://' + url;
                } else {
                  url = 'https://duckduckgo.com/?q=' + encodeURIComponent(url);
                }
              }
              currentUrl = url;
              currentProxy = '/proxy/' + btoa(url);
              document.getElementById('frame').src = currentProxy;
            }
            
            function openOriginal() {
              window.open(currentUrl, '_blank');
            }
            
            // iframe監視
            const iframe = document.getElementById('frame');
            setInterval(() => {
              try {
                const title = iframe.contentDocument?.title || 'about:blank';
                if (title && title !== 'about:blank') {
                  document.title = title;
                }
              } catch (e) {}
            }, 1000);
          <\/script>
        </body>
        </html>
      `);
      win.document.close();
      
      const tabId = Date.now();
      const tab = {
        id: tabId,
        title: new URL(url).hostname,
        url: url,
        win: win
      };
      st.tabs.push(tab);
      st.wins.set(tabId, win);
      st.activeTab = tabId;
      renderTabs();
      
      document.getElementById('urlInput').value = '';
    }

    // 初期タブ作成
    createTab();
  </script>
</body>
</html>
