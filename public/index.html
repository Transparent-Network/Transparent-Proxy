<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>home</title>
<link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">

<style>
/* ===== 全体ネオンテーマ ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,-apple-system;
  background:#050816;
  color:#00eaff;
  height:100vh;
  overflow:hidden;
}

.app{height:100vh;display:flex;flex-direction:column}

/* ===== Header ===== */
.header{
  padding:12px 20px;
  background:rgba(5,8,22,.95);
  border-bottom:1px solid rgba(0,234,255,.35);
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 0 15px rgba(0,234,255,.25);
}

.logo{
  font-size:16px;
  font-weight:600;
  text-shadow:0 0 10px rgba(0,234,255,.8);
}

.tabs{flex:1;display:flex;gap:6px;overflow-x:auto}
.tabs::-webkit-scrollbar{height:0}

.tab{
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 12px;
  background:rgba(0,234,255,.08);
  border:1px solid rgba(0,234,255,.35);
  border-radius:6px;
  cursor:pointer;
  box-shadow:0 0 8px rgba(0,234,255,.3);
}

.tab.active{
  background:rgba(0,234,255,.2);
  box-shadow:0 0 14px rgba(0,234,255,.7);
}

.tab-close{opacity:.7}
.tab-close:hover{opacity:1}

.new-btn{
  padding:6px 14px;
  background:rgba(0,234,255,.12);
  border:1px solid rgba(0,234,255,.4);
  border-radius:6px;
  color:#00eaff;
  cursor:pointer;
  box-shadow:0 0 10px rgba(0,234,255,.4);
}

/* ===== Main ===== */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:30px;
}

.search{width:100%;max-width:700px;position:relative}

.search input{
  width:100%;
  padding:14px 90px 14px 20px;
  background:rgba(0,234,255,.06);
  border:1px solid rgba(0,234,255,.4);
  border-radius:25px;
  color:#00eaff;
  box-shadow:inset 0 0 14px rgba(0,234,255,.3);
}

.search button{
  position:absolute;
  right:5px;
  top:50%;
  transform:translateY(-50%);
  padding:8px 24px;
  background:rgba(0,234,255,.2);
  border:1px solid rgba(0,234,255,.5);
  border-radius:20px;
  color:#00eaff;
  cursor:pointer;
  box-shadow:0 0 14px rgba(0,234,255,.7);
}

.title{
  font-size:42px;
  text-shadow:0 0 20px rgba(0,234,255,1);
}

/* ===== Footer ===== */
.footer{
  padding:10px 20px;
  background:rgba(5,8,22,.95);
  border-top:1px solid rgba(0,234,255,.35);
  display:flex;
  justify-content:space-between;
  font-size:12px;
}
</style>
</head>

<body>
<div class="app">
  <div class="header">
    <div class="logo">Transparent</div>
    <div class="tabs" id="tabs"></div>
    <button class="new-btn" id="new">新規</button>
  </div>

  <div class="main">
    <div class="search">
      <input id="input" placeholder="検索またはURLを入力">
      <button id="go">GO</button>
    </div>
    <div class="title">Transparent</div>
  </div>

  <div class="footer">
    <span id="status">準備完了</span>
    <span>v2.1</span>
  </div>
</div>

<script>
const SE="https://duckduckgo.com/?q="
let tabs=[],act=null,cnt=0,wins={}

const inp=input
const go=document.getElementById("go")
const nb=document.getElementById("new")
const tb=document.getElementById("tabs")
const st=document.getElementById("status")

function init(){
  go.onclick=handleGo
  nb.onclick=newTab
  inp.onkeypress=e=>e.key==="Enter"&&handleGo()
  newTab()
}

function newTab(){
  const id=cnt++
  tabs.push({id,t:"新規",u:""})
  act=id
  draw()
}

function draw(){
  tb.innerHTML=""
  tabs.forEach(tab=>{
    const d=document.createElement("div")
    d.className="tab"+(tab.id===act?" active":"")
    d.innerHTML=`<span>${tab.t}</span><span class="tab-close">×</span>`
    d.onclick=()=>{act=tab.id;inp.value=tab.u;draw()}
    d.querySelector(".tab-close").onclick=e=>{
      e.stopPropagation()
      closeTab(tab.id)
    }
    tb.appendChild(d)
  })
}

function closeTab(id){
  const i=tabs.findIndex(t=>t.id===id)
  if(i===-1)return
  if(wins[id]&&!wins[id].closed)wins[id].close()
  tabs.splice(i,1)
  if(!tabs.length)newTab()
  else{act=tabs[Math.max(0,i-1)].id;draw()}
}

function handleGo(){
  let v=inp.value.trim()
  if(!v)return
  let url
  if(/^https?:\/\//.test(v))url=v
  else if(v.includes(".")&&!v.includes(" "))url="https://"+v
  else url=SE+encodeURIComponent(v)
  openPage(url)
}

function openPage(url){
  const prx="/proxy/"+btoa(url)
  const w=window.open("about:blank")
  wins[act]=w

  w.document.write(`<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>about:blank</title>
<style>
body{margin:0;background:#050816;color:#00eaff;font-family:system-ui}
.bar{
  height:44px;
  background:rgba(5,8,22,.95);
  border-bottom:1px solid rgba(0,234,255,.4);
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 10px;
  box-shadow:0 0 15px rgba(0,234,255,.4);
}
button{
  width:30px;height:30px;
  background:rgba(0,234,255,.1);
  border:1px solid rgba(0,234,255,.4);
  color:#00eaff;
  border-radius:6px;
  cursor:pointer;
  box-shadow:0 0 10px rgba(0,234,255,.6);
}
input{
  flex:1;height:30px;
  background:rgba(0,234,255,.06);
  border:1px solid rgba(0,234,255,.4);
  border-radius:15px;
  padding:0 10px;
  color:#00eaff;
}
iframe{
  position:fixed;
  top:44px;left:0;
  width:100%;height:calc(100% - 44px);
  border:none;
}
</style>
</head>
<body>
<div class="bar">
<button onclick="history.back()">◀</button>
<button onclick="history.forward()">▶</button>
<button onclick="location.reload()">↻</button>
<input value="${url}">
<button onclick="window.close()">✕</button>
</div>
<iframe src="${prx}"></iframe>
</body></html>`)

  w.document.close()

  const tab=tabs.find(t=>t.id===act)
  tab.u=url
  try{tab.t=new URL(url).hostname}catch{tab.t="page"}
  draw()
}

window.onload=init
</script>
</body>
</html>
