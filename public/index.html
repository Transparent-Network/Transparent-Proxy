<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Yu Gothic', sans-serif;
      background: #0a0e27;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0, 217, 255, 0.15) 0%, transparent 70%);
      animation: pulse 8s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(10%, 10%) scale(1.1); }
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(15, 20, 40, 0.85);
      border: 2px solid #00d9ff;
      border-radius: 24px;
      padding: 60px 50px;
      box-shadow: 0 0 60px rgba(0, 217, 255, 0.4), inset 0 0 40px rgba(0, 217, 255, 0.08);
      max-width: 580px;
      width: 90%;
      backdrop-filter: blur(12px);
    }

    h1 {
      font-size: 48px;
      text-align: center;
      margin-bottom: 40px;
      background: linear-gradient(90deg, #00d9ff, #0099ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 0 0 40px rgba(0, 217, 255, 0.6);
      animation: neon 2s ease-in-out infinite alternate;
    }

    @keyframes neon {
      from { filter: brightness(1); }
      to { filter: brightness(1.4); }
    }

    .input-group {
      display: flex;
      gap: 14px;
    }

    input {
      flex: 1;
      padding: 18px 24px;
      background: rgba(20, 30, 60, 0.7);
      border: 2px solid #00d9ff;
      border-radius: 14px;
      color: #fff;
      font-size: 16px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.25);
    }

    input:focus {
      outline: none;
      border-color: #00ffff;
      box-shadow: 0 0 35px rgba(0, 255, 255, 0.6);
      background: rgba(20, 30, 60, 0.9);
      transform: translateY(-2px);
    }

    input::placeholder {
      color: #6b9fcc;
      opacity: 0.8;
    }

    button {
      padding: 18px 42px;
      background: linear-gradient(135deg, #00d9ff, #0099ff);
      color: #0a0e27;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 25px rgba(0, 217, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    button:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 40px rgba(0, 217, 255, 0.9);
    }

    button:active {
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Transparent Proxy</h1>
    
    <div class="input-group">
      <input 
        type="text" 
        id="urlInput" 
        placeholder="youtube.com" 
        onkeydown="if(event.key==='Enter') go()"
        autocomplete="off"
      >
      <button onclick="go()">GO</button>
    </div>
  </div>

  <script>
    function go() {
      let url = document.getElementById('urlInput').value.trim();
      if (!url) return;

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      url = url.replace(/^(https?:\/\/)www\./, '$1');

      const xorKey = 2;
      const buf = [];
      for (let i = 0; i < url.length; i++) {
        buf.push(String.fromCharCode(url.charCodeAt(i) ^ xorKey));
      }
      const encoded = btoa(buf.join('')).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');

      const win = window.open('about:blank', '_blank');
      if (!win) return alert('ポップアップがブロックされました');

      const html = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; flex-direction: column; height: 100vh; background: #0a0e27; overflow: hidden; }
    .toolbar {
      background: linear-gradient(135deg, #0f1428, #1a2240);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid #00d9ff;
      box-shadow: 0 3px 20px rgba(0, 217, 255, 0.35);
    }
    .toolbar button {
      background: rgba(0, 217, 255, 0.2);
      border: 1px solid #00d9ff;
      color: #00d9ff;
      font-size: 20px;
      cursor: pointer;
      padding: 10px 16px;
      border-radius: 10px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 15px rgba(0, 217, 255, 0.25);
      font-weight: 600;
    }
    .toolbar button:hover { 
      background: rgba(0, 217, 255, 0.5);
      box-shadow: 0 0 30px rgba(0, 217, 255, 0.7);
      transform: translateY(-3px);
    }
    .url-bar {
      flex: 1;
      background: rgba(20, 30, 60, 0.85);
      border: 2px solid #00d9ff;
      color: #fff;
      padding: 12px 20px;
      border-radius: 22px;
      font-size: 15px;
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.25);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .url-bar:focus { 
      outline: none;
      border-color: #00ffff;
      box-shadow: 0 0 35px rgba(0, 255, 255, 0.6);
      background: rgba(20, 30, 60, 0.95);
    }
    iframe { flex: 1; border: none; background: #fff; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="goBack()">←</button>
    <button onclick="goForward()">→</button>
    <button onclick="reload()">⟳</button>
    <button onclick="goHome()">🏠</button>
    <input type="text" class="url-bar" id="urlBar" value="${url}" onkeydown="if(event.key==='Enter') navigate()">
  </div>
  <iframe id="frame" src="/service/${encoded}"></iframe>
  <script>
    function goBack() { try { document.getElementById('frame').contentWindow.history.back(); } catch(e) {} }
    function goForward() { try { document.getElementById('frame').contentWindow.history.forward(); } catch(e) {} }
    function reload() { const f = document.getElementById('frame'); f.src = f.src; }
    function goHome() { document.getElementById('frame').src = 'about:blank'; }
    function navigate() {
      let url = document.getElementById('urlBar').value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
      url = url.replace(/^(https?:\\/\\/www\\.)/, 'https://');
      const xorKey = 2;
      const buf = [];
      for (let i = 0; i < url.length; i++) buf.push(String.fromCharCode(url.charCodeAt(i) ^ xorKey));
      const encoded = btoa(buf.join('')).replace(/\\+/g, '-').replace(/\\//g, '_').replace(/=/g, '');
      document.getElementById('frame').src = '/service/' + encoded;
      document.getElementById('urlBar').value = url;
    }
  <\/script>
</body>
</html>`;

      win.document.open();
      win.document.write(html);
      win.document.close();
    }
  </script>
</body>
</html>
