<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home</title>
    <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0e27;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 12px 20px;
            background: rgba(10, 15, 35, 0.95);
            border-bottom: 1px solid rgba(0, 217, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 16px;
            font-weight: 600;
            color: #00d9ff;
            margin-right: 8px;
        }

        .tabs {
            flex: 1;
            display: flex;
            gap: 6px;
            overflow-x: auto;
        }

        .tabs::-webkit-scrollbar { height: 0; }

        .tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(0, 217, 255, 0.05);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab:hover {
            background: rgba(0, 217, 255, 0.1);
            border-color: rgba(0, 217, 255, 0.4);
        }

        .tab.active {
            background: rgba(0, 217, 255, 0.15);
            border-color: rgba(0, 217, 255, 0.5);
        }

        .tab-close {
            opacity: 0.6;
            font-size: 14px;
        }

        .tab-close:hover { opacity: 1; }

        .new-btn {
            padding: 6px 14px;
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 6px;
            color: #00d9ff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .new-btn:hover {
            background: rgba(0, 217, 255, 0.2);
            border-color: rgba(0, 217, 255, 0.5);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px;
            gap: 30px;
            align-items: center;
            justify-content: center;
        }

        .search {
            width: 100%;
            max-width: 700px;
            position: relative;
        }

        .search input {
            width: 100%;
            padding: 14px 90px 14px 20px;
            background: rgba(0, 217, 255, 0.05);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 25px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .search input:focus {
            background: rgba(0, 217, 255, 0.1);
            border-color: rgba(0, 217, 255, 0.5);
        }

        .search input::placeholder {
            color: rgba(0, 217, 255, 0.5);
        }

        .search button {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            padding: 8px 24px;
            background: rgba(0, 217, 255, 0.15);
            border: 1px solid rgba(0, 217, 255, 0.4);
            border-radius: 20px;
            color: #00d9ff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search button:hover {
            background: rgba(0, 217, 255, 0.25);
            border-color: rgba(0, 217, 255, 0.6);
        }

        .title {
            font-size: 42px;
            font-weight: 600;
            color: #00d9ff;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }

        .footer {
            padding: 10px 20px;
            background: rgba(10, 15, 35, 0.95);
            border-top: 1px solid rgba(0, 217, 255, 0.3);
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(0, 217, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="logo">Transparent</div>
            <div class="tabs" id="tabs"></div>
            <button class="new-btn" id="new">新規</button>
        </div>

        <div class="main">
            <div class="search">
                <input type="text" id="input" placeholder="検索またはURLを入力" autocomplete="off">
                <button id="go">GO</button>
            </div>
            <div class="title">Transparent</div>
        </div>

        <div class="footer">
            <span id="status">準備完了</span>
            <span>v2.1</span>
        </div>
    </div>

    <script>
        const SE = 'https://duckduckgo.com/?q=';
        let tabs = [], act = null, cnt = 0, wins = {};
        const inp = document.getElementById('input');
        const go = document.getElementById('go');
        const nb = document.getElementById('new');
        const tb = document.getElementById('tabs');
        const st = document.getElementById('status');

        function init() {
            go.onclick = handleGo;
            nb.onclick = newTab;
            inp.onkeypress = e => { if (e.key === 'Enter') handleGo(); };
            document.onkeydown = e => {
                if (e.ctrlKey && e.key === 't') { e.preventDefault(); newTab(); }
            };
            newTab();
        }

        function newTab() {
            const id = cnt++;
            tabs.push({ id, t: '新規', u: '' });
            act = id;
            draw();
            inp.value = '';
            inp.focus();
        }

        function draw() {
            tb.innerHTML = '';
            tabs.forEach(tab => {
                const d = document.createElement('div');
                d.className = 'tab' + (tab.id === act ? ' active' : '');
                const span = document.createElement('span');
                span.textContent = tab.t;
                const close = document.createElement('span');
                close.className = 'tab-close';
                close.textContent = '×';
                close.onclick = e => {
                    e.stopPropagation();
                    closeTab(tab.id);
                };
                d.onclick = e => {
                    if (e.target === close) return;
                    act = tab.id;
                    const x = tabs.find(t => t.id === act);
                    if (x) inp.value = x.u;
                    draw();
                };
                d.appendChild(span);
                d.appendChild(close);
                tb.appendChild(d);
            });
        }

        function closeTab(id) {
            const i = tabs.findIndex(t => t.id === id);
            if (i === -1) return;
            if (wins[id] && !wins[id].closed) wins[id].close();
            delete wins[id];
            tabs.splice(i, 1);
            if (tabs.length === 0) {
                newTab();
            } else if (act === id) {
                act = tabs[Math.max(0, i - 1)].id;
                const x = tabs.find(t => t.id === act);
                if (x) inp.value = x.u;
                draw();
            } else {
                draw();
            }
        }

        function handleGo() {
            let v = inp.value.trim();
            if (!v) return;
            let url;
            if (v.match(/^https?:\/\//)) url = v;
            else if (v.includes('.') && !v.includes(' ')) url = 'https://' + v;
            else url = SE + encodeURIComponent(v);
            openURL(url);
        }

        function openURL(url) {
            st.textContent = '読み込み中';
            const prx = '/proxy/' + btoa(url);
            const w = window.open('about:blank');
            if (!w) {
                alert('ポップアップを許可してください');
                st.textContent = 'ブロック';
                return;
            }
            wins[act] = w;
            
            const h = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>home</title><link rel="icon" href="/favicon.ico"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e27;overflow:hidden}.bar{position:fixed;top:0;left:0;right:0;height:44px;background:rgba(10,15,35,.95);border-bottom:1px solid rgba(0,217,255,.3);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:999;backdrop-filter:blur(10px)}.btn{width:30px;height:30px;background:rgba(0,217,255,.08);border:1px solid rgba(0,217,255,.2);border-radius:6px;color:#00d9ff;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .2s}.btn:hover{background:rgba(0,217,255,.15);border-color:rgba(0,217,255,.4)}.url{flex:1;height:30px;padding:0 12px;background:rgba(0,217,255,.05);border:1px solid rgba(0,217,255,.2);border-radius:15px;color:#00d9ff;font-size:13px;outline:none;transition:all .2s}.url:focus{background:rgba(0,217,255,.1);border-color:rgba(0,217,255,.4)}.content{position:fixed;top:44px;left:0;right:0;bottom:0}iframe{width:100%;height:100%;border:none;background:#fff}</style></head><body><div class="bar"><button class="btn" onclick="back()">◀</button><button class="btn" onclick="forward()">▶</button><button class="btn" onclick="reload()">↻</button><button class="btn" onclick="home()">⌂</button><input class="url" id="u" value="${url}" onkeypress="if(event.key==='Enter')nav()"><button class="btn" onclick="ext()">↗</button><button class="btn" onclick="window.close()">✕</button></div><div class="content"><iframe id="f" src="${prx}"></iframe></div><script>var cu="${url.replace(/"/g, '\\"')}";var cp="${prx}";function back(){var f=document.getElementById("f");try{f.contentWindow.history.back()}catch(e){history.back()}}function forward(){var f=document.getElementById("f");try{f.contentWindow.history.forward()}catch(e){history.forward()}}function reload(){var f=document.getElementById("f");var s=f.src;f.src="about:blank";setTimeout(function(){f.src=s},100)}function home(){location.href="/"}function nav(){var v=document.getElementById("u").value.trim();if(!v)return;var nu;if(v.match(/^https?:\\/\\//))nu=v;else if(v.includes(".")&&!v.includes(" "))nu="https://"+v;else nu="https://duckduckgo.com/?q="+encodeURIComponent(v);cu=nu;cp="/proxy/"+btoa(nu);var f=document.getElementById("f");f.src=cp}function ext(){window.open(cu)}<\/script></body></html>`;
            
            w.document.write(h);
            w.document.close();

            const tab = tabs.find(t => t.id === act);
            if (tab) {
                tab.u = url;
                try { tab.t = new URL(url).hostname; }
                catch (e) { tab.t = 'ページ'; }
                draw();
            }
            st.textContent = '開きました';
            setTimeout(() => st.textContent = '準備完了', 2000);
        }

        window.onload = init;
    </script>
</body>
</html>
