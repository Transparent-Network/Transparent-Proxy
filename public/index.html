<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>home</title>
<link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0e27;color:#fff;height:100vh;overflow:hidden}
.app{height:100vh;display:flex;flex-direction:column}

/* header */
.header{padding:12px 20px;background:rgba(10,15,35,.95);border-bottom:1px solid rgba(0,217,255,.3);display:flex;align-items:center;gap:12px;backdrop-filter:blur(10px)}
.logo{font-size:16px;font-weight:600;color:#00d9ff}
.tabs{flex:1;display:flex;gap:6px;overflow-x:auto}
.tabs::-webkit-scrollbar{height:0}
.tab{display:flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(0,217,255,.05);border:1px solid rgba(0,217,255,.2);border-radius:6px;font-size:13px;cursor:pointer;white-space:nowrap}
.tab.active{background:rgba(0,217,255,.15);border-color:rgba(0,217,255,.5)}
.tab-close{opacity:.6}
.tab-close:hover{opacity:1}
.new-btn{padding:6px 14px;background:rgba(0,217,255,.1);border:1px solid rgba(0,217,255,.3);border-radius:6px;color:#00d9ff;cursor:pointer}

/* main */
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}
.search{width:100%;max-width:700px;position:relative}
.search input{width:100%;padding:14px 90px 14px 20px;background:rgba(0,217,255,.05);border:1px solid rgba(0,217,255,.3);border-radius:25px;color:#fff}
.search button{position:absolute;right:5px;top:50%;transform:translateY(-50%);padding:8px 24px;background:rgba(0,217,255,.15);border:1px solid rgba(0,217,255,.4);border-radius:20px;color:#00d9ff}
.title{font-size:42px;color:#00d9ff}

/* footer */
.footer{padding:10px 20px;background:rgba(10,15,35,.95);border-top:1px solid rgba(0,217,255,.3);display:flex;justify-content:space-between;font-size:12px;color:rgba(0,217,255,.6)}
</style>
</head>

<body>
<div class="app">
  <div class="header">
    <div class="logo">Transparent</div>
    <div class="tabs" id="tabs"></div>
    <button class="new-btn" id="new">新規</button>
  </div>

  <div class="main">
    <div class="search">
      <input id="input" placeholder="検索またはURLを入力">
      <button id="go">GO</button>
    </div>
    <div class="title">Transparent</div>
  </div>

  <div class="footer">
    <span id="status">準備完了</span>
    <span>v2.1</span>
  </div>
</div>

<script>
const SE="https://duckduckgo.com/?q="
let tabs=[],act=null,cnt=0,wins={}

const inp=document.getElementById("input")
const go=document.getElementById("go")
const nb=document.getElementById("new")
const tb=document.getElementById("tabs")
const st=document.getElementById("status")

function init(){
  go.onclick=handleGo
  nb.onclick=newTab
  inp.onkeypress=e=>{if(e.key==="Enter")handleGo()}
  document.onkeydown=e=>{if(e.ctrlKey&&e.key==="t"){e.preventDefault();newTab()}}
  newTab()
}

function newTab(){
  const id=cnt++
  tabs.push({id,t:"新規",u:""})
  act=id
  draw()
  inp.value=""
  inp.focus()
}

function draw(){
  tb.innerHTML=""
  tabs.forEach(tab=>{
    const d=document.createElement("div")
    d.className="tab"+(tab.id===act?" active":"")
    d.innerHTML=`<span>${tab.t}</span><span class="tab-close">×</span>`
    d.onclick=()=>{act=tab.id;inp.value=tab.u;draw()}
    d.querySelector(".tab-close").onclick=e=>{
      e.stopPropagation()
      closeTab(tab.id)
    }
    tb.appendChild(d)
  })
}

function closeTab(id){
  const i=tabs.findIndex(t=>t.id===id)
  if(i===-1)return
  if(wins[id]&&!wins[id].closed)wins[id].close()
  delete wins[id]
  tabs.splice(i,1)
  if(!tabs.length)newTab()
  else{act=tabs[Math.max(0,i-1)].id;draw()}
}

function handleGo(){
  let v=inp.value.trim()
  if(!v)return
  let url
  if(/^https?:\/\//.test(v))url=v
  else if(v.includes(".")&&!v.includes(" "))url="https://"+v
  else url=SE+encodeURIComponent(v)
  openPage(url)
}

function openPage(url){
  st.textContent="読み込み中"
  const prx="/proxy/"+btoa(url)
  const w=window.open("about:blank")
  if(!w){alert("ポップアップを許可してください");return}
  wins[act]=w

  w.document.write(`
<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>${url}</title>
<style>
body{margin:0;background:#0a0e27}
iframe{position:fixed;top:44px;left:0;width:100%;height:calc(100% - 44px);border:none}
.bar{height:44px;background:#0a0e27;color:#00d9ff;display:flex;align-items:center;padding:0 8px;gap:6px}
button{background:rgba(0,217,255,.1);border:1px solid rgba(0,217,255,.3);color:#00d9ff;border-radius:6px}
input{flex:1;background:#000;border:1px solid rgba(0,217,255,.3);color:#00d9ff}
</style></head>
<body>
<div class="bar">
<button onclick="history.back()">◀</button>
<button onclick="history.forward()">▶</button>
<button onclick="location.reload()">↻</button>
<input value="${url}">
<button onclick="window.close()">✕</button>
</div>
<iframe src="${prx}"></iframe>
</body></html>
`)
  w.document.close()

  const tab=tabs.find(t=>t.id===act)
  tab.u=url
  try{tab.t=new URL(url).hostname}catch{tab.t="ページ"}
  draw()
  st.textContent="準備完了"
}

window.onload=init
</script>
</body>
</html>
