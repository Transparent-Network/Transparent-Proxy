<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 32px;
      color: #333;
      margin-bottom: 10px;
      text-align: center;
    }

    p {
      color: #666;
      text-align: center;
      margin-bottom: 30px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 15px 20px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      transition: border 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      padding: 15px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .note {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      font-size: 14px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌐 Transparent Proxy</h1>
    <p>任意のWebサイトにアクセスできます</p>
    
    <div class="input-group">
      <input 
        type="text" 
        id="urlInput" 
        placeholder="URLを入力 (例: youtube.com)" 
        onkeydown="if(event.key==='Enter') go()"
      >
      <button onclick="go()">GO</button>
    </div>

    <div class="note">
      ⚡ 高速・安全・強力なプロキシサービス
    </div>
  </div>

  <script>
    function go() {
      let url = document.getElementById('urlInput').value.trim();
      if (!url) return alert('URLを入力してください');

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      url = url.replace(/^(https?:\/\/)www\./, '$1');

      const encoded = btoa(unescape(encodeURIComponent(url)));

      const win = window.open('about:blank', '_blank');
      if (!win) {
        alert('ポップアップがブロックされました');
        return;
      }

      const html = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .toolbar {
      background: #202124;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #333;
    }
    .toolbar button {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .toolbar button:hover { background: #333; }
    .url-bar {
      flex: 1;
      background: #303134;
      border: none;
      color: #fff;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 14px;
    }
    .url-bar:focus { outline: none; background: #3c4043; }
    iframe { flex: 1; border: none; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="goBack()">←</button>
    <button onclick="goForward()">→</button>
    <button onclick="reload()">⟳</button>
    <button onclick="goHome()">🏠</button>
    <input type="text" class="url-bar" id="urlBar" value="${url}" onkeydown="if(event.key==='Enter') navigate()">
  </div>
  <iframe id="frame" src="/p/${encoded}"></iframe>
  <script>
    function goBack() {
      try { document.getElementById('frame').contentWindow.history.back(); } catch(e) {}
    }
    function goForward() {
      try { document.getElementById('frame').contentWindow.history.forward(); } catch(e) {}
    }
    function reload() {
      const f = document.getElementById('frame');
      f.src = f.src;
    }
    function goHome() {
      document.getElementById('frame').src = 'about:blank';
    }
    function navigate() {
      let url = document.getElementById('urlBar').value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      url = url.replace(/^(https?:\\/\\/www\\.)/, 'https://');
      const encoded = btoa(unescape(encodeURIComponent(url)));
      document.getElementById('frame').src = '/p/' + encoded;
      document.getElementById('urlBar').value = url;
    }
  <\/script>
</body>
</html>`;

      win.document.open();
      win.document.write(html);
      win.document.close();
    }
  </script>
</body>
</html>
