<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home</title>
    <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
    
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/animations.css">
    <link rel="stylesheet" href="/assets/css/themes.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body>
    <div class="container">
        <header class="neon-header">
            <div class="logo">Transparent</div>
            <div class="controls">
                <div id="tabBar" class="tab-bar"></div>
                <button id="newTab" class="neon-btn">新規</button>
            </div>
        </header>

        <div id="contentArea" class="content-area">
            <div class="url-bar">
                <input type="text" id="urlInput" placeholder="検索またはURLを入力" spellcheck="false">
                <button id="goBtn" class="go-btn">GO</button>
            </div>

            <div class="welcome-screen">
                <h1 class="neon-text">Transparent</h1>
            </div>
        </div>
    </div>

    <script>
        const SEARCH = 'https://duckduckgo.com/?q=';
        let tabs = [];
        let active = null;
        let counter = 0;
        let windows = {};

        const urlInput = document.getElementById('urlInput');
        const goBtn = document.getElementById('goBtn');
        const newTab = document.getElementById('newTab');
        const tabBar = document.getElementById('tabBar');

        function init() {
            goBtn.onclick = handleGo;
            newTab.onclick = createTab;
            urlInput.onkeypress = e => {
                if (e.key === 'Enter') handleGo();
            };
            document.onkeydown = e => {
                if (e.ctrlKey && e.key === 't') {
                    e.preventDefault();
                    createTab();
                }
            };
            createTab();
        }

        function createTab() {
            const id = counter++;
            tabs.push({ id, title: '新規タブ', url: '' });
            active = id;
            render();
            urlInput.value = '';
            urlInput.focus();
        }

        function render() {
            tabBar.innerHTML = '';
            tabs.forEach(tab => {
                const el = document.createElement('div');
                el.className = 'tab' + (tab.id === active ? ' active' : '');
                el.innerHTML = `<span>${tab.title}</span><span class="tab-close">×</span>`;
                el.querySelector('.tab-close').onclick = e => {
                    e.stopPropagation();
                    closeTab(tab.id);
                };
                el.onclick = () => {
                    active = tab.id;
                    const t = tabs.find(x => x.id === active);
                    if (t) urlInput.value = t.url;
                    render();
                };
                tabBar.appendChild(el);
            });
        }

        function closeTab(id) {
            const idx = tabs.findIndex(t => t.id === id);
            if (idx === -1) return;
            
            if (windows[id] && !windows[id].closed) {
                windows[id].close();
            }
            delete windows[id];
            
            tabs.splice(idx, 1);
            
            if (tabs.length === 0) {
                createTab();
            } else if (active === id) {
                active = tabs[Math.max(0, idx - 1)].id;
                const t = tabs.find(x => x.id === active);
                if (t) urlInput.value = t.url;
                render();
            } else {
                render();
            }
        }

        function handleGo() {
            let input = urlInput.value.trim();
            if (!input) return;

            let url;
            if (input.match(/^https?:\/\//)) {
                url = input;
            } else if (input.includes('.') && !input.includes(' ')) {
                url = 'https://' + input;
            } else {
                url = SEARCH + encodeURIComponent(input);
            }

            openURL(url);
        }

        function openURL(url) {
            const proxy = '/proxy/' + btoa(url);
            const win = window.open('about:blank');
            
            if (!win) {
                alert('ポップアップを許可してください');
                return;
            }

            windows[active] = win;

            win.document.write('<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>ホーム</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e27;overflow:hidden;font-family:-apple-system,sans-serif}.toolbar{position:fixed;top:0;left:0;right:0;height:45px;background:rgba(15,20,45,.9);border-bottom:2px solid #00d9ff;display:flex;align-items:center;padding:0 12px;gap:8px;z-index:9999;backdrop-filter:blur(10px);box-shadow:0 4px 20px rgba(0,217,255,.2)}.btn{width:32px;height:32px;background:rgba(0,217,255,.1);border:1px solid rgba(0,217,255,.3);border-radius:8px;color:#00d9ff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s}.btn:hover{background:rgba(0,217,255,.2);border-color:#00d9ff}.url{flex:1;height:32px;padding:0 12px;background:rgba(0,217,255,.05);border:2px solid rgba(0,217,255,.3);border-radius:20px;color:#00d9ff;font-size:13px;outline:none;transition:all .2s}.url:focus{background:rgba(0,217,255,.1);border-color:#00d9ff}.content{position:fixed;top:45px;left:0;right:0;bottom:0}iframe{width:100%;height:100%;border:none;background:#fff}</style></head><body><div class="toolbar"><button class="btn" onclick="history.back()">◀</button><button class="btn" onclick="history.forward()">▶</button><button class="btn" onclick="reload()">↻</button><button class="btn" onclick="location.href=\'/\'">⌂</button><input class="url" id="urlbar" value="' + url + '" onkeypress="if(event.key===\'Enter\')nav()"><button class="btn" onclick="window.open(\'' + url + '\')">↗</button><button class="btn" onclick="window.close()">✕</button></div><div class="content"><iframe id="frame" src="' + proxy + '"></iframe></div><script>var cUrl="' + url + '";var cProxy="' + proxy + '";function reload(){document.getElementById("frame").src=cProxy}function nav(){var v=document.getElementById("urlbar").value.trim();if(!v)return;var u;if(v.match(/^https?:\\/\\//))u=v;else if(v.includes(".")&&!v.includes(" "))u="https://"+v;else u="https://duckduckgo.com/?q="+encodeURIComponent(v);cUrl=u;cProxy="/proxy/"+btoa(u);document.getElementById("frame").src=cProxy}<\/script></body></html>');
            win.document.close();

            const tab = tabs.find(t => t.id === active);
            if (tab) {
                tab.url = url;
                try {
                    tab.title = new URL(url).hostname;
                } catch (e) {
                    tab.title = 'ページ';
                }
                render();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
