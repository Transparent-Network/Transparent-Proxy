<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      background: #0a0e27;
      color: #e8eaed;
      height: 100vh;
      overflow: hidden;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0a0e27 100%);
    }
    
    .header {
      background: rgba(10, 14, 39, 0.95);
      border-bottom: 1px solid rgba(0, 217, 255, 0.15);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(20px);
      z-index: 100;
    }
    
    .logo {
      font-size: 1.4rem;
      font-weight: 600;
      color: #00d9ff;
      letter-spacing: -0.3px;
      text-shadow: 0 0 10px rgba(0, 217, 255, 0.3);
    }
    
    .new-tab-btn {
      background: rgba(0, 217, 255, 0.08);
      border: 1px solid rgba(0, 217, 255, 0.25);
      color: #00d9ff;
      padding: 0.5rem 1.3rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.3px;
    }
    
    .new-tab-btn:hover {
      background: rgba(0, 217, 255, 0.15);
      border-color: rgba(0, 217, 255, 0.4);
      transform: translateY(-1px);
    }
    
    .new-tab-btn:active {
      transform: translateY(0);
    }
    
    .tabs-container {
      background: rgba(10, 14, 39, 0.85);
      border-bottom: 1px solid rgba(0, 217, 255, 0.1);
      padding: 0 1rem;
      display: flex;
      gap: 0.25rem;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 217, 255, 0.2) transparent;
    }
    
    .tabs-container::-webkit-scrollbar {
      height: 4px;
    }
    
    .tabs-container::-webkit-scrollbar-thumb {
      background: rgba(0, 217, 255, 0.2);
      border-radius: 2px;
    }
    
    .tab {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
      font-size: 0.85rem;
      color: rgba(232, 234, 237, 0.6);
      max-width: 200px;
    }
    
    .tab:hover {
      background: rgba(0, 217, 255, 0.06);
      border-color: rgba(0, 217, 255, 0.15);
      color: rgba(232, 234, 237, 0.9);
    }
    
    .tab.active {
      background: rgba(0, 217, 255, 0.1);
      border-color: rgba(0, 217, 255, 0.3);
      color: #00d9ff;
    }
    
    .tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    
    .tab-close {
      color: rgba(232, 234, 237, 0.4);
      cursor: pointer;
      padding: 0.15rem 0.25rem;
      border-radius: 3px;
      transition: all 0.2s;
      font-size: 0.9rem;
      line-height: 1;
    }
    
    .tab-close:hover {
      background: rgba(255, 107, 107, 0.15);
      color: #ff6b6b;
    }
    
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      position: relative;
    }
    
    .main::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 217, 255, 0.03) 0%, transparent 70%);
      pointer-events: none;
    }
    
    .welcome {
      font-size: 2.8rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      color: #00d9ff;
      letter-spacing: -1px;
      text-shadow: 0 0 30px rgba(0, 217, 255, 0.2);
      position: relative;
      z-index: 1;
    }
    
    .subtitle {
      font-size: 1.05rem;
      color: rgba(232, 234, 237, 0.5);
      margin-bottom: 2.5rem;
      letter-spacing: 0.2px;
      position: relative;
      z-index: 1;
    }
    
    .search-container {
      width: 100%;
      max-width: 650px;
      position: relative;
      z-index: 1;
    }
    
    .search-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(0, 217, 255, 0.2);
      border-radius: 28px;
      padding: 0.8rem 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
    }
    
    .search-box:focus-within {
      border-color: rgba(0, 217, 255, 0.5);
      box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.08), 0 8px 24px rgba(0, 217, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
    }
    
    .search-icon {
      color: rgba(0, 217, 255, 0.6);
      font-size: 1.15rem;
      flex-shrink: 0;
    }
    
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e8eaed;
      font-size: 0.95rem;
      letter-spacing: 0.2px;
    }
    
    .search-input::placeholder {
      color: rgba(232, 234, 237, 0.35);
    }
    
    .go-btn {
      background: linear-gradient(135deg, #00d9ff 0%, #00b8d9 100%);
      border: none;
      color: #0a0e27;
      padding: 0.65rem 2rem;
      border-radius: 22px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 12px rgba(0, 217, 255, 0.2);
      letter-spacing: 0.5px;
    }
    
    .go-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 217, 255, 0.3);
    }
    
    .go-btn:active {
      transform: translateY(-1px);
    }
    
    .status {
      margin-top: 2rem;
      padding: 0.65rem 1.3rem;
      background: rgba(0, 255, 136, 0.06);
      border: 1px solid rgba(0, 255, 136, 0.15);
      border-radius: 6px;
      color: #00ff88;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      letter-spacing: 0.3px;
      position: relative;
      z-index: 1;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      background: #00ff88;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.9); }
    }
    
    @media (max-width: 768px) {
      .welcome { font-size: 2rem; }
      .subtitle { font-size: 0.9rem; }
      .search-box { padding: 0.7rem 1rem; }
      .go-btn { padding: 0.6rem 1.5rem; }
      .header { padding: 0.6rem 1rem; }
      .logo { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">Transparent</div>
      <button class="new-tab-btn" onclick="createTab()">+ 新規タブ</button>
    </div>
    
    <div class="tabs-container" id="tabs"></div>

    <div class="main">
      <h1 class="welcome">制限なく、自由に</h1>
      <p class="subtitle">高速プロキシで、どこへでも</p>
      
      <div class="search-container">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input 
            type="text" 
            class="search-input" 
            id="urlInput"
            placeholder="URLを入力、または検索..."
            autocomplete="off"
            spellcheck="false"
            onkeydown="if(event.key==='Enter')go()"
          >
          <button class="go-btn" onclick="go()">Go</button>
        </div>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        <span>準備完了</span>
      </div>
    </div>
  </div>

  <script>
    const state = {
      tabs: [],
      activeTabId: null,
      windows: new Map()
    };

    function createTab() {
      const id = Date.now();
      const tab = { id, title: '新しいタブ', url: '', win: null };
      state.tabs.push(tab);
      state.activeTabId = id;
      renderTabs();
      console.log('✅ タブ作成:', id);
    }

    function closeTab(id, event) {
      event?.stopPropagation();
      const idx = state.tabs.findIndex(t => t.id === id);
      if (idx === -1) return;
      
      const win = state.windows.get(id);
      if (win && !win.closed) win.close();
      state.windows.delete(id);
      
      state.tabs.splice(idx, 1);
      
      if (state.activeTabId === id) {
        state.activeTabId = state.tabs.length > 0 ? state.tabs[0].id : null;
      }
      
      renderTabs();
      console.log('✅ タブ閉じる:', id);
    }

    function switchTab(id) {
      state.activeTabId = id;
      renderTabs();
    }

    function renderTabs() {
      const el = document.getElementById('tabs');
      if (state.tabs.length === 0) {
        el.innerHTML = '';
        return;
      }
      el.innerHTML = state.tabs.map(t => `
        <div class="tab ${t.id === state.activeTabId ? 'active' : ''}" onclick="switchTab(${t.id})">
          <span class="tab-title">${escapeHtml(t.title)}</span>
          <span class="tab-close" onclick="closeTab(${t.id}, event)">✕</span>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function go() {
      let url = document.getElementById('urlInput').value.trim();
      if (!url) return;
      
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        if (url.includes('.') && !url.includes(' ')) {
          url = 'https://' + url;
        } else {
          url = 'https://duckduckgo.com/?q=' + encodeURIComponent(url);
        }
      }
      
      const b64 = btoa(unescape(encodeURIComponent(url)));
      const proxyUrl = `/proxy/${b64}`;
      
      const win = window.open('about:blank', '_blank');
      if (!win) {
        alert('ポップアップがブロックされました。ブラウザ設定でポップアップを許可してください。');
        return;
      }
      
      win.document.title = 'Home';
      
      const link = win.document.createElement('link');
      link.rel = 'icon';
      link.href = 'https://ssl.gstatic.com/classroom/favicon.png';
      win.document.head.appendChild(link);
      
      const escapedUrl = url.replace(/'/g, "\\'").replace(/"/g, '&quot;');
      
      win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Home</title><link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#000;overflow:hidden}.toolbar{background:#1a1a1a;border-bottom:1px solid #333;padding:.5rem 1rem;display:flex;gap:.5rem;align-items:center}.btn{background:#2a2a2a;border:1px solid #444;color:#aaa;padding:.4rem .8rem;border-radius:4px;cursor:pointer;font-size:.85rem;transition:all .2s;user-select:none}.btn:hover{background:#3a3a3a;color:#fff;border-color:#00d9ff}.urlbar{flex:1;background:#2a2a2a;border:1px solid #444;border-radius:20px;padding:.5rem 1rem;color:#fff;font-size:.9rem;outline:none}.urlbar:focus{border-color:#00d9ff}iframe{width:100%;height:calc(100vh - 50px);border:none;display:block;background:#fff}</style></head><body><div class="toolbar"><button class="btn" onclick="goBack()" title="戻る">◀</button><button class="btn" onclick="goForward()" title="進む">▶</button><button class="btn" onclick="reload()" title="再読み込み">↻</button><button class="btn" onclick="goHome()" title="ホーム">⌂</button><input class="urlbar" id="urlbar" value="${escapedUrl}" readonly onclick="this.select()" onkeydown="if(event.key==='Enter')navigate()"><button class="btn" onclick="openOriginal()" title="元のサイトを開く">↗</button><button class="btn" onclick="window.close()" title="閉じる">✕</button></div><iframe id="frame" src="${proxyUrl}"></iframe><script>let currentUrl='${escapedUrl}',currentProxy='${proxyUrl}';function goBack(){document.getElementById('frame').contentWindow.history.back()}function goForward(){document.getElementById('frame').contentWindow.history.forward()}function reload(){const f=document.getElementById('frame');f.src='';setTimeout(()=>f.src=currentProxy,50)}function goHome(){location.reload()}function navigate(){let u=document.getElementById('urlbar').value.trim();if(!u)return;if(!u.startsWith('http://')&&!u.startsWith('https://')){if(u.includes('.')&&!u.includes(' ')){u='https://'+u}else{u='https://duckduckgo.com/?q='+encodeURIComponent(u)}}currentUrl=u;currentProxy='/proxy/'+btoa(unescape(encodeURIComponent(u)));document.getElementById('urlbar').value=u;document.getElementById('frame').src=currentProxy}function openOriginal(){window.open(currentUrl,'_blank')}const iframe=document.getElementById('frame');iframe.addEventListener('load',()=>{try{const doc=iframe.contentDocument||iframe.contentWindow.document;const title=doc.title;if(title&&title!=='')document.title=title}catch(e){document.title='Home'}});setInterval(()=>{try{const doc=iframe.contentDocument||iframe.contentWindow.document;const loc=doc.location.href;if(loc&&loc!=='about:blank'&&!loc.includes('/proxy/')){const actualUrl=atob(loc.split('/proxy/')[1]||'');if(actualUrl)document.getElementById('urlbar').value=actualUrl}}catch(e){}},500)<\/script></body></html>`);
      win.document.close();
      
      const tabId = Date.now();
      const hostname = new URL(url).hostname;
      const tab = { id: tabId, title: hostname, url, win };
      state.tabs.push(tab);
      state.windows.set(tabId, win);
      state.activeTabId = tabId;
      renderTabs();
      
      document.getElementById('urlInput').value = '';
      console.log('✅ サイト開く:', url);
    }

    createTab();
    
    document.getElementById('urlInput').focus();
  </script>
</body>
</html>
